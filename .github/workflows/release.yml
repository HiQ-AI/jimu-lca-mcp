# Standalone CLI only. Historical npm/MCP releases are retained, not republished.
name: release

on:
  push:
    tags: ['cli-v*']

permissions:
  contents: write

jobs:
  native-cli:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.4'
      - run: npm ci --ignore-scripts
      - run: npm run build
      - name: Verify release version
        run: test "$GITHUB_REF_NAME" = "cli-v$(node -p 'require("./package.json").version')"
      - run: bash scripts/build-cli.sh
      - run: node scripts/check-cli.mjs build/native/jimu-lca-darwin-arm64
      - name: Publish build assets to the existing GitHub Release channel
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" build/native/jimu-lca-darwin-arm64 build/native/checksums.txt build/native/install.sh \
            --title "jimu-lca ${GITHUB_REF_NAME#cli-v} (macOS Apple Silicon)" \
            --notes 'Standalone CLI distributed from https://download.hiq.earth/cli/jimu-lca/install.sh . No Node/npm/Desktop/MCP server required. Reuses the published v0.2.0 bridge. macOS Apple Silicon only; ad-hoc signed, not notarized. Historical UUID binding constraints remain unchanged.' --verify-tag
