# Cloudflare Worker config for jimu-lca-mcp HTTP transport.
# Deploy:    npm run worker:deploy
# Dev:       npm run worker:dev (binds at http://localhost:8787)

name = "jimulca-mcp"
main = "dist/worker.js"
compatibility_date = "2025-05-01"
compatibility_flags = ["nodejs_compat"]
workers_dev = true

# The Worker never calls keychain APIs — auth comes from the request header.
# Alias keytar to a no-op shim so wrangler's bundler doesn't try to ship the
# native .node binary.
[alias]
keytar = "./dist/_shims/keytar-worker.js"

# Production environment — custom domain wired via the CF dashboard.
[env.production]
name = "jimulca-mcp-prod"
# Uncomment when the custom domain is configured:
# routes = [
#   { pattern = "jimulca-mcp.hiq.earth/*", custom_domain = true }
# ]

[env.production.vars]
JIMU_LCA_ENV = "prod"

# Dev environment for local + Workers dev URL.
[env.dev]
name = "jimulca-mcp-dev"

[env.dev.vars]
JIMU_LCA_ENV = "dev"
